name: Terraform Plan

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.14.7"
  TF_WORKING_DIR: "./Dev"

  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

jobs:
  terraform-plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    timeout-minutes: 45

    concurrency:
      group: terraform-plan
      cancel-in-progress: false

    steps:

      #-----------------------------------------
      # Checkout Repository
      #-----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      #-----------------------------------------
      # Azure Login using OIDC
      #-----------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      #-----------------------------------------
      # Install Terraform
      #-----------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      #-----------------------------------------
      # Restore Terraform Cache
      #-----------------------------------------
      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ env.TF_WORKING_DIR }}/.terraform

          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}

      #-----------------------------------------
      # Terraform Init
      #-----------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false

      #-----------------------------------------
      # Terraform Plan
      #-----------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
          -input=false \
          -out=tfplan

      #-----------------------------------------
      # Upload Plan Artifact
      #-----------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7

      #-----------------------------------------
      # Show Terraform Outputs (Optional)
      #-----------------------------------------
      - name: Terraform Output
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform output || true

      #-----------------------------------------
      # GitHub Step Summary
      #-----------------------------------------
      - name: Deployment Summary
        run: |
          echo "## Terraform Plan Completed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Version | ${{ env.TF_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Success ✅ |" >> $GITHUB_STEP_SUMMARY